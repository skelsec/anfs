NFS_CORE_PARAM {
	Protocols = 3, 4;
	# accept clients connecting from unprivileged source ports
	NFS_Port = 2049;
	MNT_Port = 20048;
	Enable_NLM = false;
	Enable_RQUOTA = false;
}

NFSV4 {
	Minor_Versions = 0, 1;
	Grace_Period = 5;
	Lease_Lifetime = 20;
	# plain numeric uid/gid in owner strings, no idmapping
	Only_Numeric_Owners = true;
}

EXPORT_DEFAULTS {
	Transports = TCP, UDP;
	SecType = sys;
	Squash = root_squash;
	PrivilegedPort = false;
}

EXPORT {
	Export_Id = 1;
	Path = /srv/exports/rw;
	Pseudo = /rw;
	Access_Type = RW;
	Squash = no_root_squash;
	FSAL { Name = VFS; }
}

EXPORT {
	Export_Id = 2;
	Path = /srv/exports/ro;
	Pseudo = /ro;
	Access_Type = RO;
	FSAL { Name = VFS; }
}

EXPORT {
	Export_Id = 3;
	Path = /srv/exports/squash;
	Pseudo = /squash;
	Access_Type = RW;
	Squash = all_squash;
	FSAL { Name = VFS; }
}

EXPORT {
	Export_Id = 4;
	Path = /srv/exports/secure;
	Pseudo = /secure;
	Access_Type = RW;
	PrivilegedPort = true;
	FSAL { Name = VFS; }
}

LOG {
	Default_Log_Level = EVENT;
}
