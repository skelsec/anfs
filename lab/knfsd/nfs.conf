[nfsd]
udp=y
tcp=y
vers3=y
vers4=y
vers4.0=y
vers4.1=y
vers4.2=y
threads=8
# After a start the server refuses NFSv4 IO for the length of the grace period
# (90 seconds by default), keep it short. The grace period can not be shorter
# than the lease time, which is also how long an idle NFSv4 client is remembered.
grace-time=15
lease-time=15

[mountd]
port=20048
udp=y
tcp=y
